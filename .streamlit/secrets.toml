# Streamlit Cloud Secrets Configuration
# Add these secrets in Streamlit Cloud dashboard:
# 1. Go to your app's Advanced Settings
# 2. Add each secret in the "Secrets" section
# 3. Use the format: KEY = "value"

# OpenAI API Key (required for GPT-4o embeddings and LLM)
OPENAI_API_KEY = "sk-proj-your-openai-key-here"

# Groq API Key (fallback LLM if OpenAI unavailable)
GROQ_API_KEY = "gsk-your-groq-key-here"
